{% extends 'users/base.html' %}

{% block content %}
                      <h2>Добавить пользователя</h2>

<div class="form-container">
    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_name">Имя:</label>
            {{ form.name }}
        </div>

        <div class="form-group">
            <label for="id_phone">Телефон:</label>
            {{ form.phone }}
        </div>

        <div class="form-group">
            <label for="id_status">Статус:</label>
            {{ form.status }}
        </div>

        <div class="form-group">
            <label for="id_direction">Направление:</label>
            {{ form.direction }}
        </div>

        <button type="submit" class="btn btn-add">Сохранить</button>
    </form>
</div>

<style>
    .form-container {
        max-width: 400px;
        margin: 20px auto;
        padding: 20px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .form-group {
        margin-bottom: 15px;
    }
    label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
    }
    input, select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    .btn-add {
        width: 100%;
        padding: 10px;
        background: #2ecc71;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        font-size: 16px;
        transition: 0.3s;
    }
    .btn-add:hover {
        background: #27ae60;
    }
</style>

{% endblock %}
