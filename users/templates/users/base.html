<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
        .topbar { background: #34495E; padding: 10px; color: white; text-align: center; }
        .sidebar { width: 250px; background: #2C3E50; color: white; height: 100vh; padding: 20px; position: fixed; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 10px; }
        .sidebar a:hover { background: #1A252F; }
        .content { margin-left: 280px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f4f4f4; }
        .btn { padding: 8px 15px; text-decoration: none; border: none; cursor: pointer; }
        .btn-edit { background: #3498db; color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        .btn-add { background: #2ecc71; color: white; }
    </style>
</head>
<body>
    <div class="topbar">
        <form method="get" action="{% url 'user_list' %}">
            <input type="text" name="q" placeholder="Поиск по имени или телефону">
            <button type="submit">Найти</button>
        </form>
    </div>
    <div class="sidebar">
        <h2>Меню</h2>
        <a href="{% url 'user_list' %}">Пользователи</a>
        <a href="{% url 'add_user' %}">Добавить пользователя</a>
        <a href="{% url 'schedule_interview' %}">Пригласить на собеседование</a>
        <a href="#">Настройки</a>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
