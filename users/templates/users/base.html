
<!DOCTYPE html>
<html lang="{% if request.COOKIES.language %}{{ request.COOKIES.language }}{% else %}ru{% endif %}">
<head>
    <meta charset="UTF-8">
    <title>Панель управления</title>
    <style>
        /* Темный жана Яркий режимдер */
        :root {
            --background-color: #f4f4f4;
            --text-color: #000;
            --sidebar-color: #2C3E50;
            --button-bg: #3498db;
            --button-hover: #217dbb;
            --table-bg: white;
            --table-text: #000;
            --input-bg: white;
            --input-text: #000;
            --search-button-bg: #2ecc71;
            --search-button-hover: #27ae60;
        }

        .dark-mode {
            --background-color: #1A252F;
            --text-color: #fff;
            --sidebar-color: #121921;
            --button-bg: #1abc9c;
            --button-hover: #16a085;
            --table-bg: #2C3E50;
            --table-text: #fff;
            --input-bg: #34495E;
            --input-text: #fff;
            --search-button-bg: #27ae60;
            --search-button-hover: #1f8a4d;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: var(--background-color);
            color: var(--text-color);
        }

        /* Топбар */
        .topbar {
            background: var(--sidebar-color);
            padding: 10px;
            color: white;
            position: fixed;
            width: calc(100% - 250px);
            top: 0;
            left: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .topbar form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .topbar input {
            padding: 8px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: var(--input-bg);
            color: var(--input-text);
        }

        .topbar button {
            padding: 8px 14px;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            height: 34px;
            font-size: 14px;
        }

        .topbar button {
            background: var(--search-button-bg);
        }

        .topbar button:hover {
            background: var(--search-button-hover);
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--sidebar-color);
            color: white;
            height: 100vh;
            padding-top: 60px;
            position: fixed;
            left: 0;
            top: 0;
        }

        .sidebar h2 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px;
            transition: 0.3s;
        }

        .sidebar a:hover, .sidebar a.active {
            background: var(--button-hover);
            border-left: 5px solid var(--button-bg);
        }

        /* Контент */
        .content {
            margin-left: 270px;
            padding: 100px 20px 20px;
        }

        /* Таблица */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--table-bg);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            color: var(--table-text);
        }

        th {
            background: var(--sidebar-color);
            color: white;
        }

        tr:hover {
            background: #3B4C5E;
        }
    </style>
</head>
<body class="{% if request.COOKIES.theme == 'dark' %}dark-mode{% endif %}">

    <!-- Топбар -->
    <div class="topbar">
        <form method="get" action="{% url 'user_list' %}">
            <input type="text" name="q" placeholder="Поиск по имени или телефону">
            <button type="submit">Найти</button>
        </form>
    </div>

    <!-- Sidebar (Меню) -->
    <div class="sidebar">
        <h2>Меню</h2>
        <a href="{% url 'user_list' %}" class="{% if request.resolver_match.url_name == 'user_list' %}active{% endif %}">Пользователи</a>
        <a href="{% url 'interview_list' %}" class="{% if request.resolver_match.url_name == 'interview_list' %}active{% endif %}">Приглашенные</a>
        <a href="{% url 'schedule_interview' %}" class="{% if request.resolver_match.url_name == 'schedule_interview' %}active{% endif %}">Пригласить</a>
        <a href="{% url 'add_user' %}" class="{% if request.resolver_match.url_name == 'add_user' %}active{% endif %}">Добавить</a>
        <a href="{% url 'settings' %}" class="{% if request.resolver_match.url_name == 'settings' %}active{% endif %}">⚙ Настройки</a>
    </div>

    <!-- Контент -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
