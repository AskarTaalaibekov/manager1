{% extends 'users/base.html' %}

{% block content %}
<div class="settings-container">
    <h2>⚙️ Настройки</h2>

    <form method="post">
        {% csrf_token %}

        <!-- Тема оформления -->
        <div class="form-group">
            <label>🎨 Тема оформления:</label>
            <select name="theme">
                <option value="light" {% if request.COOKIES.theme == "light" %}selected{% endif %}>Яркий</option>
                <option value="dark" {% if request.COOKIES.theme == "dark" %}selected{% endif %}>Темный</option>
            </select>
        </div>

        <!-- Тил тандоо -->
        <div class="form-group">
            <label>🌍 Язык интерфейса:</label>
            <select name="language">
                <option value="ru" {% if request.COOKIES.language == "ru" %}selected{% endif %}>Русский</option>
                <option value="kg" {% if request.COOKIES.language == "kg" %}selected{% endif %}>Кыргызча</option>
                <option value="en" {% if request.COOKIES.language == "en" %}selected{% endif %}>English</option>
            </select>
        </div>

        <!-- Дата форматы -->
        <div class="form-group">
            <label>📅 Формат даты:</label>
            <select name="date_format">
                <option value="dd-mm-yyyy" {% if request.COOKIES.date_format == "dd-mm-yyyy" %}selected{% endif %}>DD-MM-YYYY</option>
                <option value="yyyy-mm-dd" {% if request.COOKIES.date_format == "yyyy-mm-dd" %}selected{% endif %}>YYYY-MM-DD</option>
                <option value="mm/dd/yyyy" {% if request.COOKIES.date_format == "mm/dd/yyyy" %}selected{% endif %}>MM/DD/YYYY</option>
            </select>
        </div>

        <!-- WhatsApp чакыруу тексти -->
        <div class="form-group">
            <label>💬 Текст для WhatsApp приглашения:</label>
            <textarea name="whatsapp_text" rows="3">{{ request.session.whatsapp_text|default:"Саламатсызбы! Сиз маектешүүгө чакырылдыңыз!" }}</textarea>
        </div>

        <button type="submit" class="btn-save">💾 Сохранить</button>
    </form>
</div>

<!-- ✅ Жаңыртылган CSS -->
<style>
    .settings-container {
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        margin: 0 auto;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        color: black;
    }

    select, textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
    }

    .btn-save {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        background: #2ecc71;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-save:hover {
        background: #27ae60;
    }

    /* ✅ Карангы режимде таблицанын фону ак болот */
    .dark-mode table {
        background: white !important;
        color: black !important;
    }

    .dark-mode th {
        background: #2C3E50;
        color: white;
    }

    .dark-mode td {
        color: black !important;
    }

    /* ✅ Карангы режимде настройка барагы */
    .dark-mode .settings-container {
        background: white !important;
        color: black !important;
    }

    .dark-mode label {
        color: black !important;
    }

    .dark-mode select, .dark-mode textarea {
        background: white !important;
        color: black !important;
        border: 1px solid #ccc !important;
    }
</style>

{% endblock %}
