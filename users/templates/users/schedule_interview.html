{% extends 'users/base.html' %}

{% block content %}
<h2>Колдонуучуну маектешүүгө чакыруу</h2>
<div class="form-container">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_user">Колдонуучу:</label>
            {{ form.user }}
        </div>

        <div class="form-group">
            <label for="id_mentor">Ментор:</label>
            {{ form.mentor }}
        </div>

        <div class="form-group">
            <label for="id_date_time">Маектешүү убактысы:</label>
            {{ form.date_time }}
        </div>

        <div class="form-group">
            <label for="id_whatsapp_number">WhatsApp номер:</label>
            {{ form.whatsapp_number }}
        </div>

        <button type="submit" class="btn btn-add">Чакыруу жана WhatsApp билдирүү жөнөтүү</button>
    </form>
</div>

<style>
    .form-container {
        max-width: 400px;
        margin: 20px auto;
        padding: 20px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .form-group {
        margin-bottom: 15px;
    }
    label {
        font-weight: bold;
    }
    input, select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    .btn-add {
        width: 100%;
        padding: 10px;
        background: #2ecc71;
        color: white;
        border: none;
        cursor: pointer;
    }
</style>
{% endblock %}
