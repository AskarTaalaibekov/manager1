{% extends 'users/base.html' %}

{% block content %}
<h2>Список пользователей</h2>

<form method="get" class="filter-form">
    <label>Фильтр по статусу:</label>
    <select name="status">
        <option value="">Все</option>
        <option value="thinking">Думает</option>
        <option value="invited">Приглашен</option>
    </select>

    <label>Фильтр по направлению:</label>
    <select name="direction">
        <option value="">Все</option>
        <option value="backend_python">Backend (Python)</option>
        <option value="backend_js">Backend (JS)</option>
        <option value="frontend">Frontend</option>
        <option value="design">UI/UX Design</option>
    </select>

    <button type="submit" class="btn btn-filter">Применить</button>
</form>

<table>
    <tr>
        <th>Имя</th>
        <th>Телефон</th>
        <th>Направление</th>
        <th>Статус</th>
        <th>Действие</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user.name }}</td>
        <td>{{ user.phone }}</td>
        <td>{{ user.get_direction_display }}</td>
        <td>{{ user.get_status_display }}</td>
        <td>
            <a href="{% url 'edit_user' user.id %}" class="btn btn-edit">Редактировать</a>
            <form method="post" action="{% url 'delete_user' user.id %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-delete">Удалить</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

<style>
    /* Форма фильтра */
    .filter-form {
        margin-bottom: 15px;
    }

    .filter-form select, .filter-form button {
        padding: 8px;
        font-size: 14px;
        border-radius: 5px;
        margin-right: 10px;
    }

    .btn-filter {
        background: #2ecc71;
        color: white;
        border: none;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-filter:hover {
        background: #27ae60;
    }

    /* Таблица */
    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-top: 10px;
    }

    th, td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
        color: #000; /* Тексттин түсүн кара кылуу */
    }

    th {
        background: #34495E;
        color: white;
    }

    tr:nth-child(even) {
        background: #f9f9f9;
    }

    tr:hover {
        background: #e6e6e6;
    }

    /* Кнопкалар */
    .btn {
        padding: 8px 15px;
        border: none;
        text-decoration: none;
        font-size: 14px;
        border-radius: 5px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-edit {
        background: #2ecc71;
        color: white;
    }

    .btn-edit:hover {
        background: #27ae60;
    }

    .btn-delete {
        background: #e74c3c;
        color: white;
    }

    .btn-delete:hover {
        background: #c0392b;
    }
</style>

{% endblock %}
